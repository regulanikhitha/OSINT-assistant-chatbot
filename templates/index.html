

<!DOCTYPE html>
<html>
<head>
<title>OSINT Investigation Assistant</title>

<style>

body{
margin:0;
font-family:Arial;
display:flex;
height:100vh;
background:#f5f3ff;
}

/* SIDEBAR */

.sidebar{
width:260px;
background:#c9f7c5;
padding:20px;
overflow-y:auto;
}

.sidebar h3{
color:#4b0082;
}

.history-item{
background:white;
padding:10px;
margin-bottom:10px;
border-radius:8px;
cursor:pointer;
border:1px solid #7edc7e;
}

.history-item:hover{
background:#eaffea;
}

.new-chat{
background:#4b0082;
color:white;
padding:10px;
border:none;
width:100%;
margin-bottom:15px;
cursor:pointer;
border-radius:6px;
}

/* MAIN CHAT */

.main{
flex:1;
display:flex;
flex-direction:column;
}

/* HEADER */

.header{
background:#9370db;
color:white;
padding:15px;
font-size:20px;
}

/* CHAT BOX */

#chat-box{
flex:1;
padding:20px;
overflow-y:auto;
}

.user{
text-align:right;
color:#2e8b57;
margin:8px;
}

.bot{
text-align:left;
color:#6a0dad;
margin:8px;
}

/* INPUT */

.input-area{
display:flex;
padding:15px;
background:white;
border-top:1px solid #ddd;
}

input{
flex:1;
padding:12px;
border-radius:6px;
border:1px solid #ccc;
}

button{
padding:12px 20px;
margin-left:10px;
background:#2e8b57;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="sidebar">

<button class="new-chat" onclick="newChat()">+ New Chat</button>

<h3>Chat History</h3>

<div id="history-list"></div>

</div>


<div class="main">

<div class="header">
OSINT Investigation Assistant
</div>

<div id="chat-box"></div>

<div class="input-area">
<input type="text" id="user-input" placeholder="Ask about OSINT...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
